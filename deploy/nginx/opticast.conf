# Gunicorn debe escuchar en 127.0.0.1:8001 antes de activar este servidor.
# La URL pública de las TVs conserva el puerto 5001.
server {
    listen 5001;
    server_name _;

    client_max_body_size 64m;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 10s;

    access_log /var/log/nginx/opticast-access.log;
    error_log /var/log/nginx/opticast-error.log warn;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_ignore_client_abort off;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
        proxy_busy_buffers_size 128k;
        # Límite por respuesta, no límite global. Los archivos mayores
        # pueden seguir dependiendo de la velocidad del cliente.
        proxy_max_temp_file_size 64m;
        proxy_cache off;
    }
}
