<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Carrusel</title>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        .media { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
                 object-fit: contain; visibility: hidden; }
        #status { color: white; font: 24px sans-serif; text-align: center;
                  position: absolute; top: 45%; width: 100%; }
    </style>
</head>
<body>
    <div id="status" role="status">Cargando contenido…</div>
    <img id="image0" class="media" alt="">
    <video id="video0" class="media" muted playsinline preload="metadata"></video>
    <img id="image1" class="media" alt="">
    <video id="video1" class="media" muted playsinline preload="metadata"></video>
    <script>
        var carouselMedia = {{ media|tojson }};
        {% include 'player.js' %}
    </script>
</body>
</html>
