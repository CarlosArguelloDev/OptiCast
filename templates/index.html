<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Carrusel</title>
    <style>
        body {
            margin: 0;
            background: black;
            overflow: hidden;
        }
        #viewer {
            width: 100vw;
            height: 100vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div id="container">
        <img id="viewer" src="" style="display:none;">
        <video id="video" width="100%" height="100%" style="display:none;" autoplay muted></video>
    </div>

    <script>
        const media = {{ media|tojson }};
        let index = 0;

        function showNext() {
            const file = media[index];
            const img = document.getElementById("viewer");
            const vid = document.getElementById("video");

            if (file.endsWith(".mp4") || file.endsWith(".webm")) {
                img.style.display = "none";
                vid.style.display = "block";
                vid.src = "/static/" + file;
                vid.play();

                vid.onended = () => {
                    index = (index + 1) % media.length;
                    showNext();
                };

            } else {
                vid.style.display = "none";
                img.style.display = "block";
                img.src = "/static/" + file;

                setTimeout(() => {
                    index = (index + 1) % media.length;
                    showNext();
                }, 5000);
            }
        }

        showNext();
    </script>

</body>
</html>
