{% extends 'base.html' %}
{% block body %}
<header><div><strong>OptiCast</strong></div></header>
<main class="card login"><h1>Iniciar sesión</h1>
{% for category,message in get_flashed_messages(with_categories=true) %}<div class="notice {{category}}">{{message}}</div>{% endfor %}
<form method="post" class="stack"><input type="hidden" name="csrf" value="{{csrf}}"><div><label for="username">Usuario</label><input id="username" name="username" autocomplete="username" required></div><div><label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button>Entrar al panel</button></form>
</main>
{% endblock %}
